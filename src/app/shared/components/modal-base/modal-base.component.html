<div 
  *ngIf="show" 
  class="modal-overlay" 
  [@modalAnimation]
  (click)="onOverlayClick($event)"
  (keydown.escape)="onEscapeKey($any($event))"
  tabindex="-1"
>
  <div 
    class="modal-container"
    [ngClass]="'modal-' + size"
    [@contentAnimation]
    [style.max-height]="maxHeight"
  >
    <div class="modal-header">
      <h2 class="modal-title">{{ title }}</h2>
      <button 
        *ngIf="closable"
        class="modal-close-btn" 
        (click)="onClose()"
        type="button"
        aria-label="Cerrar modal"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>

 
    <div class="modal-body" [class.loading]="loading">
      <div *ngIf="loading" class="modal-loading">
        <div class="spinner">
          <i class="fas fa-spinner fa-spin"></i>
        </div>
        <span>Cargando...</span>
      </div>
      <div [style.display]="loading ? 'none' : 'block'">
        <ng-content></ng-content>
      </div>
    </div>


    <div *ngIf="showFooter" class="modal-footer">
      <ng-content select="[slot=footer]"></ng-content>
      
      <div *ngIf="showDefaultButtons" class="default-footer-buttons">
        <button 
          type="button" 
          class="btn btn-outline" 
          (click)="onCancel()"
          [disabled]="loading"
        >
          Cancelar
        </button>
        <button 
          type="button" 
          class="btn btn-primary" 
          (click)="onConfirm()"
          [disabled]="loading"
        >
          <i *ngIf="loading" class="fas fa-spinner fa-spin"></i>
          Confirmar
        </button>
      </div>
    </div>
  </div>
</div>
