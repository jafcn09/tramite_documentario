<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-auto flex flex-col">
    <!-- Header -->
    <div class="flex justify-between items-center p-6 border-b border-gray-200 sticky top-0 bg-white">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Vista Previa del Documento</h2>
        <p class="text-sm text-gray-600 mt-1" *ngIf="currentDocument">
          {{ currentDocument.nombre }}
        </p>
      </div>
      <button
        (click)="close()"
        class="text-gray-600 hover:text-gray-800 transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div class="flex-grow flex items-center justify-center p-6">
      <div *ngIf="canPreviewDocument && pdfUrl" class="w-full h-full">
        <iframe
          [src]="pdfUrl"
          class="w-full h-[600px] border border-gray-300 rounded-lg"
          frameborder="0"
        ></iframe>
      </div>
      <div *ngIf="!canPreviewDocument" class="text-center py-12">
        <svg class="w-16 h-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
        <p class="text-gray-600 mb-4">Este tipo de documento no puede ser visualizado en el navegador</p>
        <button
          (click)="downloadDocument()"
          class="px-6 py-2 bg-university-600 text-white rounded-lg hover:bg-university-700 transition-colors"
        >
          Descargar Documento
        </button>
      </div>
    </div>
    <div class="p-6 border-t border-gray-200 bg-gray-50 flex justify-end gap-4">
      <button
        (click)="downloadDocument()"
        class="px-6 py-2 bg-university-600 text-white rounded-lg hover:bg-university-700 transition-colors font-medium flex items-center gap-2"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        Descargar
      </button>
      <button
        (click)="close()"
        class="px-6 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400 transition-colors font-medium"
      >
        Cerrar
      </button>
    </div>
  </div>
</div>
