<div class="bg-white rounded-2xl shadow-lg p-8">
  <div *ngIf="showError" class="bg-red-50 border-l-4 border-red-500 p-4 rounded mb-6">
    <p class="text-red-700">{{ errorMessage }}</p>
  </div>
  <div *ngIf="successMessage" class="bg-green-50 border-l-4 border-green-500 p-4 rounded mb-6">
    <p class="text-green-700">{{ successMessage }}</p>
  </div>

  <form (ngSubmit)="submitForm()" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Documento</label>
        <select
          [(ngModel)]="tramiteForm.tipoDocumento"
          name="tipoDocumento"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
        >
          <option *ngFor="let tipo of tiposDocumento" [value]="tipo.value">
            {{ tipo.label }}
          </option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Número de Documento</label>
        <input
          type="text"
          [(ngModel)]="tramiteForm.numeroDocumento"
          (input)="onNumericInputChange($event, 'numeroDocumento')"
          name="numeroDocumento"
          [placeholder]="getTipoDocumentoConfig().placeholder"
          [maxlength]="getTipoDocumentoConfig().maxLength"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
        />
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Nombres</label>
        <input
          type="text"
          [(ngModel)]="tramiteForm.nombres"
          name="nombres"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Apellidos</label>
        <input
          type="text"
          [(ngModel)]="tramiteForm.apellidos"
          name="apellidos"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
        />
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Correo</label>
        <input
          type="email"
          [(ngModel)]="tramiteForm.email"
          name="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono (Opcional)</label>
        <input
          type="text"
          [(ngModel)]="tramiteForm.telefono"
          (input)="onNumericInputChange($event, 'telefono')"
          name="telefono"
          maxlength="9"
          placeholder="123456789"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
        />
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Trámite</label>
      <select
        [(ngModel)]="tramiteForm.tipoTramite"
        name="tipoTramite"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
      >
        <option value="">Selecciona un tipo de trámite</option>
        <option *ngFor="let tipo of tiposTramite" [value]="tipo.value">
          {{ tipo.label }}
        </option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Asunto</label>
      <input
        type="text"
        [(ngModel)]="tramiteForm.asunto"
        name="asunto"
        maxlength="200"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
      />
      <p class="text-xs text-gray-500 mt-1">{{ tramiteForm.asunto.length }}/200 caracteres</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Descripción (Opcional)</label>
      <textarea
        [(ngModel)]="tramiteForm.descripcion"
        name="descripcion"
        maxlength="2000"
        rows="4"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
      ></textarea>
      <p class="text-xs text-gray-500 mt-1">{{ tramiteForm.descripcion.length }}/2000 caracteres</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Archivos (Máximo 3, tamaño máximo 50MB cada uno)</label>
      <input
        type="file"
        multiple
        accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"
        (change)="onFileSelect($event)"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
      />
      <div *ngIf="archivosPreview.length > 0" class="mt-4 space-y-2">
        <div *ngFor="let archivo of archivosPreview; let i = index" class="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
          <div class="flex items-center gap-3">
            <img *ngIf="archivo.preview" [src]="archivo.preview" class="w-10 h-10 object-cover rounded" />
            <span class="text-sm font-medium text-gray-700">{{ archivo.file.name }}</span>
          </div>
          <button
            type="button"
            (click)="removeFile(i)"
            class="text-red-600 hover:text-red-800 transition-colors"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="border border-gray-300 rounded-lg p-4">
      <div class="flex items-center justify-between mb-4">
        <label class="block text-sm font-medium text-gray-700">CAPTCHA</label>
        <button
          type="button"
          (click)="generateCaptcha()"
          [disabled]="isLoadingCaptcha"
          class="text-university-600 hover:text-university-700 disabled:opacity-50 transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <div *ngIf="captchaImage" class="bg-gray-100 p-4 rounded border border-gray-300 flex items-center justify-center min-h-24">
            <img [src]="captchaImage.includes('data:') ? captchaImage : 'data:image/png;base64,' + captchaImage" alt="CAPTCHA" class="w-full h-auto max-w-full" />
          </div>
          <div *ngIf="!captchaImage" class="bg-gray-100 p-4 rounded border border-gray-300 flex items-center justify-center h-24">
            <p class="text-gray-500 text-sm">Cargando CAPTCHA...</p>
          </div>
        </div>
        <div>
          <input
            type="text"
            [(ngModel)]="tramiteForm.captchaCode"
            name="captchaCode"
            placeholder="Ingresa el código"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-university-500"
          />
        </div>
      </div>
    </div>
    <div class="flex gap-4 pt-6">
      <button
        type="submit"
        [disabled]="isSubmittingTramite"
        class="flex-1 px-6 py-3 bg-university-600 text-white rounded-lg hover:bg-university-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium"
      >
        <span *ngIf="!isSubmittingTramite">Crear Trámite</span>
        <span *ngIf="isSubmittingTramite">Enviando...</span>
      </button>
      <button
        type="button"
        (click)="resetForm()"
        class="flex-1 px-6 py-3 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400 transition-colors font-medium"
      >
        Limpiar
      </button>
    </div>
  </form>
</div>
