<div class="min-h-screen bg-gray-50">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="bg-university-gradient text-white p-8 text-center">
        <h2 class="text-2xl font-bold mb-2">Bienvenido al Manual de Usuario</h2>
        <p class="text-sm">Aquí encontrarás toda la información necesaria para utilizar el Sistema De Secretaria General de la Universidad Nacional de Tumbes.</p>
      </div>

      <div class="p-8">
        <button
          (click)="toggleIndex()"
          class="md:hidden fixed bottom-6 right-6 z-50 w-14 h-14 bg-university-600 hover:bg-university-700 text-white rounded-full shadow-2xl flex items-center justify-center transition-all duration-300 hover:scale-110"
          [class.bg-university-700]="showIndex">
          <svg *ngIf="!showIndex" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <svg *ngIf="showIndex" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>

        <div class="grid md:grid-cols-4 gap-8">
          <div class="md:col-span-1">
            <div
              *ngIf="showIndex"
              (click)="toggleIndex()"
              class="md:hidden fixed inset-0 bg-black bg-opacity-50 z-40 animate-fade-in">
            </div>

            <div
              [class.translate-x-0]="showIndex"
              [class.-translate-x-full]="!showIndex"
              class="fixed md:relative md:translate-x-0 top-0 left-0 h-full md:h-auto w-72 md:w-auto bg-white md:bg-transparent z-50 md:z-auto transition-transform duration-300 shadow-2xl md:shadow-none overflow-y-auto md:overflow-visible p-6 md:p-0">

           
              <div class="md:hidden flex justify-between items-center mb-6 pb-4 border-b border-gray-200">
                <h3 class="font-bold text-university-700 text-lg flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                  </svg>
                  Índice
                </h3>
                <button (click)="toggleIndex()" class="text-gray-500 hover:text-gray-700">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
              </div>

              <div class="sticky top-24">
                <h3 class="hidden md:flex font-bold text-university-700 mb-4 items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                  </svg>
                  Índice
                </h3>
                <nav class="space-y-2">
                  <button *ngFor="let section of manualSections; let i = index"
                     (click)="scrollToSection(section.id); toggleIndex()"
                     class="w-full text-left px-3 py-2 text-sm text-gray-600 hover:text-university-600 hover:bg-university-50 rounded-lg transition-colors flex items-center">
                    <span class="w-6 h-6 bg-university-100 text-university-700 rounded-full flex items-center justify-center text-xs font-bold mr-3 flex-shrink-0">
                      {{ i + 1 }}
                    </span>
                    <span class="line-clamp-2">{{ section.title }}</span>
                  </button>
                </nav>
              </div>
            </div>
          </div>

          <div class="md:col-span-3 space-y-8">
            <div *ngFor="let section of manualSections; let i = index" 
                 [id]="section.id" 
                 class="bg-gray-50 rounded-xl p-6 border-l-4 border-university-500 scroll-mt-24">
              <div class="flex items-center mb-4">
                <span class="w-8 h-8 bg-university-gradient text-white rounded-full flex items-center justify-center text-sm font-bold mr-3">
                  {{ i + 1 }}
                </span>
                <h2 class="text-xl font-bold text-university-800">{{ section.title }}</h2>
              </div>
              <p class="text-gray-700 mb-6 leading-relaxed">{{ section.content }}</p>
              
              <div *ngIf="section.steps" class="bg-white rounded-lg p-4">
                <h4 class="font-semibold text-university-700 mb-4 flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                  </svg>
                  Pasos a seguir:
                </h4>
                <ol class="space-y-3">
                  <li *ngFor="let step of section.steps; let stepIndex = index"
                      class="flex items-start">
                    <span class="w-6 h-6 bg-university-500 text-white rounded-full flex items-center justify-center text-xs font-bold mr-3 mt-0.5 flex-shrink-0">
                      {{ stepIndex + 1 }}
                    </span>
                    <span class="text-gray-700" [innerHTML]="step"></span>
                  </li>
                </ol>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
