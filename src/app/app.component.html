<div class="min-h-screen transition-colors duration-300" [ngClass]="{'bg-gray-50': !isDarkMode, 'bg-slate-900': isDarkMode}">
  <div *ngIf="isLoading"
       class="fixed inset-0 z-50 flex items-center justify-center transition-all duration-300"
       [ngClass]="{
         'bg-white': !isDarkMode,
         'bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900': isDarkMode
       }">
    <div class="text-center">
      <div class="mb-8">
        <img src="assets/logo.png"
             alt="UNTUMBES"
             class="w-24 h-24 mx-auto rounded-xl animate-bounce"
             [ngClass]="{
               'shadow-2xl shadow-university-500/30': !isDarkMode,
               'shadow-2xl shadow-blue-500/50': isDarkMode
             }">
      </div>
      <div class="mb-6">
        <p class="font-bold text-xl transition-colors"
           [ngClass]="{
             'text-university-700': !isDarkMode,
             'text-white': isDarkMode
           }">Universidad Nacional de Tumbes</p>
        <p class="text-sm mt-2 transition-colors"
           [ngClass]="{
             'text-university-600': !isDarkMode,
             'text-slate-300': isDarkMode
           }">Rumbo a la excelencia</p>
      </div>
      <div class="flex justify-center space-x-2">
        <div class="w-3 h-3 rounded-full animate-bounce transition-all"
             [ngClass]="{
               'bg-university-500 shadow-lg shadow-university-500/40': !isDarkMode,
               'bg-blue-400 shadow-lg shadow-blue-400/50': isDarkMode
             }"
             style="animation-delay: 0s;"></div>
        <div class="w-3 h-3 rounded-full animate-bounce transition-all"
             [ngClass]="{
               'bg-university-600 shadow-lg shadow-university-600/40': !isDarkMode,
               'bg-blue-500 shadow-lg shadow-blue-500/50': isDarkMode
             }"
             style="animation-delay: 0.2s;"></div>
        <div class="w-3 h-3 rounded-full animate-bounce transition-all"
             [ngClass]="{
               'bg-university-700 shadow-lg shadow-university-700/40': !isDarkMode,
               'bg-blue-600 shadow-lg shadow-blue-600/50': isDarkMode
             }"
             style="animation-delay: 0.4s;"></div>
      </div>
    </div>
  </div>

  <nav *ngIf="showHeader && showContent"
       class="shadow-sm border-b-4 fixed top-0 left-0 right-0 z-40 transition-all duration-300"
       [ngClass]="{
         'bg-white border-university-500': !isDarkMode,
         'bg-slate-800 border-blue-500': isDarkMode
       }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-4 cursor-pointer" (click)="goHome()">
          <img src="assets/logo.png" alt="UNTUMBES" class="w-12 h-12 rounded-lg shadow-md">
          <div class="hidden sm:block">
            <h1 class="text-lg font-semibold transition-colors"
                [ngClass]="{
                  'text-university-700 hover:text-university-600': !isDarkMode,
                  'text-slate-50 hover:text-blue-400': isDarkMode
                }">Sistema de Secretaria General</h1>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <app-theme-toggle></app-theme-toggle>
          <button *ngIf="showHomeButton"
                  (click)="goHome()"
                  class="px-4 py-2 rounded-lg font-medium transition-all hidden sm:inline-flex"
                  [ngClass]="{
                    'btn-university': !isDarkMode,
                    'bg-blue-500 text-white hover:bg-blue-600': isDarkMode
                  }">
            Inicio
          </button>
          <button *ngIf="showHomeButton"
                  (click)="goHome()"
                  class="p-2 rounded-lg font-medium transition-all sm:hidden"
                  [ngClass]="{
                    'btn-university': !isDarkMode,
                    'bg-blue-500 text-white hover:bg-blue-600': isDarkMode
                  }">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main [class.pt-16]="showHeader" class="min-h-screen flex flex-col" *ngIf="showContent">
    <div class="flex-1">
      <router-outlet />
    </div>

    <footer *ngIf="showFooter"
            class="py-4 mt-auto transition-colors"
            [ngClass]="{
              'bg-university-700 text-white': !isDarkMode,
              'bg-slate-800 text-slate-200': isDarkMode
            }">
      <div class="container mx-auto px-4">
        <div class="flex flex-col sm:flex-row items-center justify-center text-sm text-center sm:text-left space-y-1 sm:space-y-0">
          <span>&copy; {{ currentYear }} | Universidad Nacional de Tumbes | </span>
          <span class="sm:ml-1">Acreditada por Sunedu.</span>
        </div>
      </div>
    </footer>
  </main>
</div>
