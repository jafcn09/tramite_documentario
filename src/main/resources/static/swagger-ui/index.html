<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Trámite Documentario - API</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css">
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32"/>
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16"/>
    <style>
        /* 1. Ocultar enlace /v3/api-docs */
        .swagger-ui .info hgroup.main a,
        .swagger-ui .info .base-url,
        .swagger-ui .info .link {
            display: none !important;
        }
        /* 2. Ocultar selector de Servers */
        .swagger-ui .scheme-container {
            display: none !important;
        }
    </style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="./swagger-ui-bundle.js" charset="UTF-8"></script>
<script src="./swagger-ui-standalone-preset.js" charset="UTF-8"></script>
<script>
    window.onload = function() {
        window.ui = SwaggerUIBundle({
            url: "/v3/api-docs",
            dom_id: '#swagger-ui',
            deepLinking: true,
            filter: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "StandaloneLayout",
            defaultModelsExpandDepth: -1,
            operationsSorter: "method",
            tagsSorter: "alpha",
            tryItOutEnabled: true
        });

        // 3. Cambiar placeholder de Filter by tag a español
        setTimeout(function() {
            var filterInput = document.querySelector('.filter-container input[type="text"]');
            if (filterInput) {
                filterInput.placeholder = 'Filtrar por etiqueta...';
            }
        }, 1000);
    };
</script>
</body>
</html>
