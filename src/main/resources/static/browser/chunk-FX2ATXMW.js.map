<div class="modal-overlay" *ngIf="modalState.isOpen" (click)="onOverlayClick()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header" [ngClass]="getHeaderClass()">
      <div class="modal-icon">
        <i [class]="getIcon()"></i>
      </div>
      <h3>{{ modalState.config?.title }}</h3>
    </div>

    <div class="modal-body">
      <p>{{ modalState.config?.message }}</p>
    </div>

    <div class="modal-footer">
      <button
        *ngIf="modalState.config?.showCancel"
        class="btn btn-secondary"
        (click)="onCancel()">
        {{ modalState.config?.cancelText }}
      </button>
      <button
        class="btn"
        [ngClass]="getConfirmButtonClass()"
        (click)="onConfirm()">
        {{ modalState.config?.confirmText }}
      </button>
    </div>
  </div>
</div>
