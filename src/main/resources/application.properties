spring.application.name=demo
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_tramites}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Martin2024}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Database Performance Configuration - Optimized for 1000 daily users
# With load balancing (3 instances): 25 connections per instance
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Pagination limits to prevent memory issues - Increased for performance
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:nacionaltumbes@gmail.com}
spring.mail.password=${MAIL_PASSWORD:jsvjbndmehnjygqt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT Configuration
jwt.secret=${JWT_SECRET:A7x9K2mP8qR4tY6vB9nM5pS3wX7zA1cF8jL2dG5hK9mQ6rT4yU8iO0pL3nB6vC9x}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis Configuration for Session Management
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000
spring.data.redis.database=${REDIS_DATABASE:0}

# Redis Connection Pool Configuration - Optimized for 1000 daily users
# Formula: 1 connection per 30 concurrent users + 20% overhead
spring.data.redis.jedis.pool.max-active=64
spring.data.redis.jedis.pool.max-wait=3000ms
spring.data.redis.jedis.pool.max-idle=32
spring.data.redis.jedis.pool.min-idle=8

# Spring Session Configuration
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=tramite:session
spring.session.timeout=PT30M

# Cache Configuration - Aggressive caching for 1000+ req/sec
spring.cache.type=redis
spring.cache.redis.time-to-live=PT1H
spring.cache.redis.cache-null-values=true
# Enable all caching features
spring.cache.cache-names=tramites,usuarios,roles,areas,notificaciones,permissions,organizacion

# Compression for large cached values
spring.redis.codec.compression-type=GZIP

# Maximum inline reply length to handle large cached objects
spring.data.redis.client-name=demo-app
spring.data.redis.connect-timeout=3000

# Cache pre-warming for frequently accessed data
spring.cache.dynamic=true

# Server Configuration - Optimized for 1000 concurrent users
server.port=${SERVER_PORT:8081}

# Tomcat Thread Pool - 300 threads allows ~150 concurrent users per instance
# With 3 instances: 450 threads = 1000+ concurrent users
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=2000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=60000

# Request/Response compression
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Application URL Configuration
app.url=${APP_URL:http://localhost:4200}

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Logging Configuration - Optimized for production scalability
# Disable SQL logging in production to reduce overhead by 30%
logging.level.com.example.demo=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
server.error.include-message=always
server.error.include-stacktrace=on-param
server.error.include-exception=false
