spring.application.name=demo
spring.config.import=optional:file:/Users/jhafetcanepa/Documents/tramite_documentario/back/.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_tramites}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=none


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true
spring.flyway.repair-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true


spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100


spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000
spring.data.redis.database=${REDIS_DATABASE:0}


spring.data.redis.jedis.pool.max-active=64
spring.data.redis.jedis.pool.max-wait=3000ms
spring.data.redis.jedis.pool.max-idle=32
spring.data.redis.jedis.pool.min-idle=8


spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=tramite:session
spring.session.timeout=PT30M

spring.cache.type=redis
spring.cache.redis.time-to-live=PT1H
spring.cache.redis.cache-null-values=true

spring.cache.cache-names=tramites,usuarios,roles,areas,notificaciones,permissions,organizacion


spring.redis.codec.compression-type=GZIP


spring.data.redis.client-name=demo-app
spring.data.redis.connect-timeout=3000


spring.cache.dynamic=true


server.port=${SERVER_PORT:8081}


server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=2000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=60000

server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain


app.url=${APP_URL:http://localhost:4200}


app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=160MB
spring.servlet.multipart.enabled=true


logging.level.com.example.demo=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false


management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.base-path=/actuator
management.endpoint.shutdown.enabled=false


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.defaultModelsExpandDepth=-1
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packagesToScan=com.example.demo.controller
springdoc.pathsToMatch=/api/**
